<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chẩn đoán bệnh cây trồng</title>
    
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.ripples/0.5.3/jquery.ripples.min.js"></script>
</head>
<body>

    <div id="ripple-background"></div>

    <div class="app-container">
        
        <header>
            <h1>Chẩn đoán bệnh cây trồng</h1>
        </header>

        <div id="systemStatus" class="status-pill">Đang tải dữ liệu AI...</div>

        <div class="viewport-container">
            <img id="displayImage" src="" alt="Ảnh tải lên" class="hidden">
            
            <video id="videoStream" autoplay playsinline muted class="hidden"></video>
            
            <div id="placeholderUI">
                <i class="material-icons placeholder-icon">spa</i>
                <p>Chọn phương thức để bắt đầu</p>
            </div>

            <button id="resultBtn" class="result-floating-btn hidden">
                <span class="pulse-ring"></span>
                <span id="resultText">Đang quét...</span>
                <i class="material-icons">touch_app</i>
            </button>
        </div>

        <div class="control-bar">
            <input type="file" id="uploadInput" accept="image/*" hidden>
            <button class="control-btn" onclick="document.getElementById('uploadInput').click()">
                <i class="material-icons">image</i>
                <span>Tải Ảnh</span>
            </button>

            <button class="control-btn main-action" id="cameraToggle">
                <i class="material-icons">qr_code_scanner</i>
                <span>Quét Camera</span>
            </button>

            <button class="control-btn" id="scopeBtn">
                <i class="material-icons">list_alt</i>
                <span>Phạm vi</span>
            </button>
        </div>
    </div>

    <div id="detailOverlay" class="overlay hidden">
        <div class="overlay-header">
            <button class="back-btn" id="closeDetailBtn">
                <i class="material-icons">arrow_back</i> Quay lại
            </button>
            <h2>Chi tiết Phác đồ</h2>
        </div>
        <div class="overlay-content" id="detailContent">
            </div>
    </div>

    <div id="scopeOverlay" class="overlay hidden">
        <div class="overlay-header">
            <button class="back-btn" id="closeScopeBtn">
                <i class="material-icons">arrow_back</i> Quay lại
            </button>
            <h2>Danh mục bệnh hỗ trợ</h2>
        </div>
        <div class="overlay-content grid-view" id="scopeContent">
            </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
