<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPDM - QUẢN LÝ BỆNH CÂY TRỒNG</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/progressbar.js/1.1.1/progressbar.min.js"></script>
</head>
<body class="light-mode">
    <div class="header-container">
        <h1>🌱 IPDM HỆ THỐNG CHẨN ĐOÁN BỆNH CÂY</h1>
        <button class="mode-toggle" id="modeToggle">
            <i class="material-icons">brightness_4</i> Chế độ Tối
        </button>
    </div>
    <hr>

    <div class="status" id="mainStatus">Đang khởi động hệ thống...</div> 
    
    <div class="input-selection-container">
        <div class="upload-btn-container">
            <div class="upload-btn-wrapper upload-wrapper">
                <input type="file" id="uploadImage" accept="image/*" style="display: none;"/>
                <button class="btn upload-file" onclick="document.getElementById('uploadImage').click();">
                    <i class="material-icons">cloud_upload</i> Tải Ảnh
                </button>
            </div>
            <button class="btn camera-btn" id="cameraToggle">
                <i class="material-icons">camera_alt</i> Camera
            </button>
        </div>
    </div>
    
    <div class="camera-stream-container" id="cameraContainer">
        <video id="videoStream" autoplay playsinline></video>
        <div class="camera-controls">
            <button id="captureButton" class="capture-btn" disabled>
                <i class="material-icons">camera</i> Chụp
            </button>
            <button id="stopButton" class="capture-btn stop-btn">
                <i class="material-icons">videocam_off</i> Dừng
            </button>
        </div>
        <p class="camera-status" id="cameraStatus"></p>
    </div>

    <div class="row">
        <div class="box image-box">
            <img src="" alt="Ảnh phân tích" id="image">
            <canvas id="canvas" style="display: none;"></canvas>
            <div class="image-placeholder">
                <i class="material-icons" style="font-size: 48px; color: #ccc;">image</i>
                <p>Vui lòng tải ảnh hoặc chụp ảnh lá cây.</p>
            </div>
        </div>

        <div class="box box-result" id="boxResult">
            <div class="loading-bar" id="loadingPredictionBar">
                <div class="loading-fill"></div>
                <p>Đang chẩn đoán...</p>
            </div>

            <h2>Kết quả: <span class="pred_class">--</span></h2>
            
            <div class="accuracy">
                <div class="progress" id="progress"></div>
            </div>
            <p class="confidence-summary">
                Độ tin cậy: <b><span class="confidence">0</span>%</b>
            </p>
        </div>
    </div>

    <div class="protocol-detail-container" id="resultContainer">
        </div>
    
    <script src="script.js"></script>
</body>
</html>
