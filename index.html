<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPDM - HỆ THỐNG CHẨN ĐOÁN & QUẢN LÝ BỆNH CÂY</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/progressbar.js/1.1.1/progressbar.min.js"></script>
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.ripples/0.5.3/jquery.ripples.min.js"></script>
</head>
<body class="light-mode">
    
    <div id="ripple-background"></div> 
    
    <div class="header-container">
        <h1>🌱 IPDM: CHẨN ĐOÁN & PHÁC ĐỒ ĐIỀU TRỊ</h1>
        <button class="mode-toggle" id="modeToggle">
            <i class="material-icons">brightness_4</i> Chế độ Tối
        </button>
    </div>

    <div class="main-status-bar">
        <span id="mainStatus" class="status-indicator ready">Đang tải dữ liệu...</span>
    </div>

    <div class="row main-content-row">
        
        <div class="box camera-box">
            <div class="camera-container hidden" id="cameraContainer">
                <video id="videoStream" autoplay></video>
                <div class="camera-overlay"></div>
            </div>
            <div class="camera-controls">
                <button id="cameraToggle" class="capture-btn">
                    <i class="material-icons">videocam</i> Bật Camera
                </button>
                <button id="captureButton" class="capture-btn" disabled>
                    <i class="material-icons">camera</i> Chụp
                </button>
                <button id="stopButton" class="capture-btn stop-btn">
                    <i class="material-icons">videocam_off</i> Đóng
                </button>
            </div>
            <p class="camera-status" id="cameraStatus"></p>
        </div>

        <div class="box image-box">
            <img src="" alt="Ảnh phân tích" id="image">
            <canvas id="canvas" width="640" height="480" style="display: none;"></canvas> 
            <p class="image-placeholder">
                <i class="material-icons" style="font-size: 48px; color: #ccc;">image</i><br>
                Chọn ảnh hoặc chụp để phân tích
            </p>
        </div>

        <div class="box box-result" id="boxResult">
            <div class="loading-bar hidden" id="loadingPredictionBar">
                <div class="loading-fill"></div>
                <p>Đang chẩn đoán bệnh...</p>
            </div>

            <h2>Kết quả chẩn đoán: <span class="pred_class">---</span></h2>
            
            <div class="accuracy">
                <div id="progress"></div> </div>
            <p class="confidence-summary">
                Độ tin cậy: <b><span class="confidence">0.00</span>%</b>
            </p>

            <button class="action-btn primary" id="uploadImage">
                <i class="material-icons">cloud_upload</i> Tải ảnh lên
            </button>
            <input type="file" id="uploadImage" accept="image/*" hidden>
            
            <button class="action-btn secondary hidden" id="detailBtn">
                <i class="material-icons">info</i> Xem Phác đồ Chi tiết
            </button>

            <button class="action-btn tertiary" id="scopeBtn">
                <i class="material-icons">list_alt</i> Danh mục hỗ trợ
            </button>
        </div>
    </div>
    
    <div id="detailOverlay" class="overlay hidden">
        <div class="overlay-header">
            <button class="back-btn" id="closeDetailBtn">
                <i class="material-icons">arrow_back</i> Quay lại
            </button>
            <h2>Chi tiết Phác đồ</h2>
        </div>
        <div class="overlay-content" id="detailContent">
        </div>
    </div>

    <div id="scopeOverlay" class="overlay hidden">
        <div class="overlay-header">
            <button class="back-btn" id="closeScopeBtn">
                <i class="material-icons">arrow_back</i> Quay lại
            </button>
            <h2>Danh mục bệnh hỗ trợ</h2>
        </div>
        <div class="overlay-content grid-view" id="scopeContent">
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
