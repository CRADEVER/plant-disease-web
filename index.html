<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nhận diện bệnh cây 🌿</title>
  
  <link rel="stylesheet" href="/plant-disease-web/style.css"> 
  
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>

</head>
<body>

  <h1>🌱 Hệ thống nhận diện bệnh cây</h1>
  
  <div id="camera-section">
    <video id="camera" autoplay playsinline></video>
    
    <canvas id="snapshot" style="display:none"></canvas>
    <img id="uploaded-image-preview" style="display:none; max-width: 400px; margin: 10px 0; border-radius: 10px; border: 2px solid #4caf50;">
  </div>
  
  <div id="controls">
    <button id="capture">📸 Chụp ảnh</button>
    
    <label for="file-upload" class="custom-file-upload">
      Tải ảnh lên
    </label>
    <input type="file" id="file-upload" accept="image/*" style="display: none;">
  </div>
  
  <div id="result">⏳ Đang tải model...</div>
  
  <script src="/plant-disease-web/script.js"></script>
</body>
</html>
