<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HỆ THỐNG PHÂN LOẠI & QUẢN LÝ BỆNH CÂY (IPM)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-fork-ribbon-css/0.2.3/gh-fork-ribbon.min.css" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="light-mode">
    <div class="header-container">
        <h1>🌱 HỆ THỐNG NHẬN DIỆN BỆNH CÂY</h1>
        <button class="mode-toggle" id="modeToggle">
            <i class="material-icons">brightness_4</i> Chế độ Tối
        </button>
    </div>
    <hr>


    <div class="upload-btn-container">
        <div class="upload-btn-wrapper upload-wrapper">
            <button class="btn upload-file font-weight-500">
                <span class="upload-btn">
                    <i class="material-icons d-block font-50">cloud_upload</i>
                    <span id="choose-text-1">TẢI ẢNH LÁ CÂY LÊN</span>
                    <span class="success-1">
                        <i class="fa fa-check-circle"></i>
                        <span id="blankFile-1"></span>
                    </span>
                </span>
            </button>
            <input type="file" name="uploadImage" id="uploadImage" accept=".jpg, .jpeg, .png">
        </div>

        <div class="camera-btn-wrapper upload-wrapper">
            <button class="btn upload-file font-weight-500 camera-btn" id="cameraToggle">
                <span class="camera-icon">
                    <i class="material-icons d-block font-50">photo_camera</i>
                    <span>CHỤP ẢNH TỪ CAMERA</span>
                </span>
            </button>
        </div>
    </div>
    
    <div class="camera-stream-container" id="cameraContainer">
        <video id="videoStream" width="320" height="240" autoplay></video>
        <button id="captureButton" class="capture-btn" disabled>Chụp</button>
        <button id="stopButton" class="capture-btn stop-btn">Dừng Camera</button>
        <p class="camera-status" id="cameraStatus"></p>
    </div>


    <div class="row">
        <div class="box box-image">
            <img src="" alt="Ảnh lá cây đã chọn/chụp" id="image">
            <canvas id="canvas" width="224" height="224" style="display: none;"></canvas>
        </div>
    </div>
    
    <div class="analysis-card" id="analysisCard">
        <div class="init_status"></div>
        
        <div class="prediction-summary-container">
            <h2>Dự đoán bệnh cây: <span class="pred_class"></span></h2>
            <div class="accuracy">
                <div class="progress" id="progress">
                    <div class="inner"></div>
                </div>
            </div>
            <p class="confidence-text"> ĐỘ CHÍNH XÁC: <b><span class="confidence"></span></b> %</p>
        </div>

        <div class="disease-details" id="diseaseDetails">
            </div>

    </div>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/progressbar.js/1.0.1/progressbar.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
    <script src="script.js"></script>

</body>
</html>
